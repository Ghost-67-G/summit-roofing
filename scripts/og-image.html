<!doctype html>
<!--
  Source for public/og-image.jpg (1200×630). Regenerate after a rebrand with:
    npm run og
  which screenshots this file in headless Chrome.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Archivo';
        src: url('../node_modules/@fontsource-variable/archivo/files/archivo-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      * { margin: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        display: grid;
        grid-template-columns: 700px 1fr;
        font-family: 'Archivo', sans-serif;
        background: #121619;
        color: #fff;
      }
      .panel {
        position: relative;
        padding: 60px 56px 56px 64px;
        display: flex;
        flex-direction: column;
        background:
          repeating-linear-gradient(135deg, rgb(255 255 255 / 0.035) 0 2px, transparent 2px 22px),
          repeating-linear-gradient(45deg, rgb(255 255 255 / 0.025) 0 2px, transparent 2px 22px),
          radial-gradient(circle at 0 0, rgb(200 35 26 / 0.35), transparent 55%),
          #121619;
      }
      .brand { display: flex; align-items: center; gap: 16px; }
      .brand svg { width: 64px; height: 64px; }
      .brand strong { display: block; font-size: 32px; font-weight: 900; letter-spacing: -0.01em; text-transform: uppercase; line-height: 1; }
      .brand span { display: block; margin-top: 6px; font-size: 14px; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; color: #f89c8f; }
      h1 { margin-top: auto; font-size: 58px; line-height: 1.02; font-weight: 900; letter-spacing: -0.03em; }
      h1 em { display: block; font-style: normal; color: #f2705f; }
      .meta { margin-top: 30px; display: flex; gap: 14px; }
      .pill {
        display: flex; align-items: center; gap: 10px;
        padding: 12px 20px; border-radius: 999px;
        font-size: 21px; font-weight: 700;
        background: rgb(255 255 255 / 0.08); border: 1px solid rgb(255 255 255 / 0.15);
      }
      .pill.cta { background: #c8231a; border-color: #c8231a; }
      .stars { color: #f5a524; letter-spacing: 2px; }
      .photo { position: relative; }
      .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 60% center; }
      .photo::before {
        content: ''; position: absolute; inset: 0 auto 0 -1px; width: 90px; z-index: 1;
        background: linear-gradient(to right, #121619, transparent);
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="brand">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <rect width="48" height="48" rx="12" fill="#121619" stroke="rgb(255 255 255 / 0.2)" />
          <path d="M9.5 26.5 24 13l14.5 13.5" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M15.5 35 24 27l8.5 8" fill="none" stroke="#e3412f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M31.5 13.5v5.5" stroke="#fff" stroke-width="4" stroke-linecap="round" />
        </svg>
        <div>
          <strong>Summit</strong>
          <span>Roofing Co.</span>
        </div>
      </div>
      <h1>Roofs built to last. <em>Free inspections.</em></h1>
      <div class="meta">
        <span class="pill"><span class="stars">★★★★★</span> 4.8 · 400+ reviews</span>
        <span class="pill cta">(704) 555-0192</span>
      </div>
    </div>
    <div class="photo"><img src="../images/hero-roof-crew.jpg" alt="" /></div>
  </body>
</html>
